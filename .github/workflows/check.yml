name: jailbirds checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # a good run is about 9 minutes. a stuck one stops here, not at the 6 hour default
    timeout-minutes: 30
    # the browsers and all they need come in the image, so no run waits on a package mirror.
    # the tag is the playwright version in package.json: tests/ci.test.mjs holds the two together
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          # the milestone version needs real history and tags
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results-check-${{ github.run_id }}
          path: test-results/
          retention-days: 14
